<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Statement Analysis Assistant</title>
<style>
:root{--bg:#f6f5f1;--ink:#17202a;--mut:#5d6670;--line:#d9d6cc;--card:#fff;--acc:#0b5d4b;--warn:#b4531a}
@media(prefers-color-scheme:dark){:root{--bg:#12171c;--ink:#e8e6e0;--mut:#9aa3ab;--line:#2c343b;--card:#1a2127;--acc:#4cc2a1;--warn:#e8985f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 60px}
h1{font:600 28px/1.2 Georgia,serif;margin:0 0 6px}
h2{font:600 19px Georgia,serif;margin:30px 0 10px}
p.lead{color:var(--mut);margin:0 0 20px;max-width:64ch}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{font-size:13px;color:var(--mut);display:block}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;font-weight:600;color:var(--mut)}
td input{width:100%;min-width:90px;text-align:right}
tr.grp td{background:transparent;text-align:left;font-weight:600;color:var(--acc);border-bottom:2px solid var(--line)}
.wrap{overflow-x:auto}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--acc);padding:9px 16px;cursor:pointer}
button.pri{background:var(--acc);color:var(--bg)}
button.sec{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.act{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.err{color:var(--warn);font-weight:600;margin:8px 0}
.flag{color:var(--warn);font-weight:600}
.note{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;white-space:pre-wrap}
code{background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
<h1>Financial Statement Analysis Assistant</h1>
<p class="lead">Enter figures for the previous and current period. Leave a box empty if you do not have the figure. Every number is calculated in code using the formulas in SKILL.md; Claude only writes the commentary.</p>

<div class="bar">
  <div><label for="unit">Currency and unit</label>
    <select id="unit"><option>Rs</option><option>Rs thousands</option><option>Rs lakhs</option><option>Rs crores</option><option>Rs millions</option><option>USD</option></select></div>
  <div><label for="thr">Flag changes above (%)</label><input id="thr" type="number" value="10" min="0" max="1000" style="width:90px"></div>
</div>

<div class="wrap"><table id="inputs"><thead><tr><th>Item</th><th>Previous period</th><th>Current period</th></tr></thead><tbody></tbody></table></div>
<div class="act">
  <button class="pri" id="go">Analyse</button>
  <button class="sec" id="sample">Load worked example</button>
  <button class="sec" id="clear">Clear</button>
</div>
<div id="msg" class="err" role="alert"></div>
<div id="out"></div>
</main>
<script src="analysis.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const tb = $("#inputs tbody");
let g = "";
FSA.FIELDS.forEach((f) => {
  if (f.g !== g) { g = f.g; tb.insertAdjacentHTML("beforeend", `<tr class="grp"><td colspan="3">${g}</td></tr>`); }
  tb.insertAdjacentHTML("beforeend", `<tr><td>${f.label}</td><td><input inputmode="decimal" id="p_${f.k}" aria-label="${f.label}, previous"></td><td><input inputmode="decimal" id="c_${f.k}" aria-label="${f.label}, current"></td></tr>`);
});

const read = () => {
  const o = { prev: {}, cur: {}, unit: $("#unit").value, threshold: $("#thr").value };
  FSA.FIELDS.forEach((f) => { o.prev[f.k] = $("#p_" + f.k).value; o.cur[f.k] = $("#c_" + f.k).value; });
  return o;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = (v) => (v === null || v === undefined ? "–" : Number(v).toLocaleString("en-IN", { maximumFractionDigits: 2 }));
const pc = (v) => (v === null ? "–" : (v > 0 ? "+" : "") + v + "%");
const tbl = (head, rows) => `<div class="wrap"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
const tr = (cells) => `<tr>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;

function render(a, unit) {
  const by = (grp) => a.items.filter((i) => i.group === grp);
  const itemTable = (grp) => {
    const rows = by(grp);
    if (!rows.length) return `<p class="note">No ${grp.toLowerCase()} figures were provided.</p>`;
    return tbl(["Item (" + esc(unit) + ")", "Previous", "Current", "Change", "Change %"],
      rows.map((i) => tr([i.label, n(i.prev), n(i.cur), n(i.diff),
        i.pct === null ? `<span class="note">${i.pctNote ? esc(i.pctNote) : "–"}</span>` : (i.significant ? `<span class="flag">${pc(i.pct)} ▲ review</span>` : pc(i.pct))])));
  };
  const val = (r) => (r.v !== null ? n(r.v) : `<span class="note">${esc(r.why)}</span>`);
  const cf = a.cashflow.some((c) => c.prev !== null || c.cur !== null)
    ? tbl(["Activity", "Previous", "Current", "Reading (current)"], a.cashflow.map((c) => tr([c.label, n(c.prev), n(c.cur), c.curSays])))
      + `<p class="note">Net change in cash (operating + investing + financing): previous ${n(a.netChangeInCash.prev)}, current ${n(a.netChangeInCash.cur)}. Positive or negative cash flow is not treated as good or bad on its own.</p>`
    : `<p class="note">No cash flow figures were provided.</p>`;
  const growth = tbl(["Measure", "Formula", "Result"], a.growth.map((x) => tr([x.name, `<span class="note">${x.formula}</span>`, (x.v !== null ? pc(x.v) : `<span class="note">${esc(x.why)}</span>`) + (x.note ? `<br><span class="note">${esc(x.note)}</span>` : "")])));
  const ratios = tbl(["Ratio", "Formula", "Previous", "Current"], a.ratios.map((r) => tr([r.name + (r.note ? `<br><span class="note">${esc(r.note)}</span>` : ""), `<span class="note">${r.formula}</span>`, val(r.prev), val(r.cur)])));
  const sig = a.items.filter((i) => i.significant);
  const trends = sig.length
    ? "<ul>" + sig.map((i) => `<li>${i.label}: ${i.pct > 0 ? "increased" : "decreased"} by ${Math.abs(i.pct)}% (${n(i.prev)} to ${n(i.cur)}), above the ${a.threshold}% review level.</li>`).join("") + "</ul>"
    : `<p class="note">No item changed by more than ${a.threshold}%, or both periods were not provided.</p>`;
  const miss = a.missingCurrent.length ? `<p class="note">Not provided for the current period: ${a.missingCurrent.join(", ")}.</p>` : "";
  return `
  <h2>1, 7, 8. Summary, insights and areas to review</h2><div class="box" id="ai">Writing commentary with Claude…</div>
  <h2>2. Income statement analysis</h2>${itemTable("Income Statement")}${growth}
  <h2>3. Balance sheet analysis</h2>${itemTable("Balance Sheet")}
  <h2>4. Cash flow analysis</h2>${cf}
  <h2>5. Ratio analysis</h2>${ratios}
  <h2>6. Key trends and changes</h2>${trends}${miss}
  <p class="note">Analysis uses only the figures entered. It is not investment, tax or legal advice.</p>`;
}

$("#go").onclick = async () => {
  const inp = read();
  $("#msg").textContent = "";
  const e = FSA.validate(inp);
  if (e) { $("#msg").textContent = e; return; }
  const a = FSA.analyse(inp, inp.threshold);
  $("#out").innerHTML = render(a, inp.unit);
  try {
    const r = await fetch("/api/commentary", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(inp) });
    const d = await r.json();
    $("#ai").textContent = d.commentary || "Commentary unavailable (" + (d.commentaryError || d.error || "unknown error") + "). The tables below are still correct.";
  } catch (x) {
    $("#ai").textContent = "Commentary unavailable (could not reach the server). The tables below are still correct.";
  }
};
$("#sample").onclick = () => {
  const s = { revenue: ["1000000", "1200000"], opProfit: ["200000", "240000"], netProfit: ["150000", "180000"], currentAssets: [null, "600000"], currentLiabilities: [null, "300000"], equity: [null, "500000"], debt: [null, "200000"] };
  $("#clear").click();
  for (const k in s) { if (s[k][0]) $("#p_" + k).value = s[k][0]; if (s[k][1]) $("#c_" + k).value = s[k][1]; }
};
$("#clear").onclick = () => { document.querySelectorAll("#inputs input").forEach((i) => (i.value = "")); $("#out").innerHTML = ""; $("#msg").textContent = ""; };
</script>
</body>
</html>
